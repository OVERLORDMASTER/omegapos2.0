<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Automático con Sonido</title>
    <style>
        /* Reseteo básico para ocupar toda la pantalla */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }

        /* Contenedor principal que ocupa toda la ventana */
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Video de fondo a pantalla completa */
        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Asegura que cubra toda la pantalla sin deformarse */
            z-index: 1;
        }

        /* Capa opcional de texto superpuesto */
        .content-overlay {
            position: relative;
            z-index: 2;
            color: #fff;
            text-align: center;
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.8);
            pointer-events: none; /* Permite hacer clic a través del texto si fuera necesario */
        }

        .content-overlay h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .content-overlay p {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- 
          Atributos clave:
          - autoplay: Inicia la reproducción sola.
          - controls: Muestra los controles por si el navegador bloquea el autoplay con sonido.
          - loop: Opcional, repite el video infinitamente.
          - muted: Esencial para que el autoplay funcione en la mayoría de navegadores.
          - playsinline: Necesario para dispositivos móviles.
        -->
        <video id="bg-video" autoplay muted loop playsinline>
            <source src="assets/video.mp4" type="video/mp4">
            Tu navegador no soporta la reproducción de video.
        </video>

        <!-- Capa para activar sonido -->
        <div id="sound-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 3; display: flex; justify-content: center; align-items: center; cursor: pointer;">
            <div style="color: white; text-align: center; text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.8);">
                <h1>Toca para activar el sonido</h1>
            </div>
        </div>

        <!-- Opcional: Texto encima del video -->
        <div class="content-overlay">
            <h1>Bienvenidos</h1>
            <p>pura bendicion</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('bg-video');
            const soundOverlay = document.getElementById('sound-overlay');

            soundOverlay.addEventListener('click', () => {
                video.muted = false;
                soundOverlay.style.display = 'none';
            }, { once: true }); // El evento solo se ejecutará una vez
        });
    </script>
</body>
</html>
